name: Publicar relatório executivo V5.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar-relatorio.yml'
      - 'codigo/gerar_relatorio.py'
      - 'codigo/processar_etl.py'
      - 'dados/contatos_sinteticos.csv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependências PDF
        run: python -m pip install reportlab pypdf
      - name: Gerar relatório V5.1
        run: python codigo/gerar_relatorio.py
      - name: Conferir páginas e links
        run: |
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          p=Path('entregaveis/Relatorio_Executivo_CX_V5_1.pdf')
          reader=PdfReader(str(p))
          assert len(reader.pages)==8, len(reader.pages)
          annots=reader.pages[-1].get('/Annots',[])
          links=[ref.get_object().get('/A',{}).get('/URI') for ref in annots]
          assert 'https://github.com/Wandersonlimas/portfolio-cx-eficiencia' in links
          assert 'https://wandersonlimas.github.io/portfolio-cx-eficiencia/' in links
          print('PDF V5.1 validado: oito páginas e dois links clicáveis')
          PY
      - name: Publicar arquivo gerado na branch main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add entregaveis/Relatorio_Executivo_CX_V5_1.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs(case01): atualizar PDF V5.1 a partir do gerador [skip ci]"
            git push
          fi
